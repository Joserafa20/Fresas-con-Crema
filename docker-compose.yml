services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maison}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maison}
      POSTGRES_DB: ${POSTGRES_DB:-maison_fraise}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maison} -d ${POSTGRES_DB:-maison_fraise}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
