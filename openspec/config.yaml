    framework: "Vitest (proposed: vitest for web + api, happy-dom/jsdom, @testing-library/react)"
  layers:
    unit: { available: false, tool: "vitest (proposed)" }
    integration: { available: false, tool: "@testing-library/react + supertest (proposed)" }
    e2e: { available: false, tool: "Playwright (proposed, optional)" }
