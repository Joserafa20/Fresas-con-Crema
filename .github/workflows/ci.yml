name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check no hardcoded catalog prices
        run: |
          ! grep -R --include="*.ts" --include="*.tsx" -E "10000|12000|15000" apps/ packages/ --exclude-dir=node_modules | grep -v "seed" | grep -v "TOPPING" | grep -v "priceCents" | grep -q .
      - run: pnpm build
